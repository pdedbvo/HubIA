:root{
  color-scheme:dark;
  --bg:#0D0D0D; --panel:#151515; --panel2:#1C1C1C; --line:#2B2B2B; --line2:#3A3A3A;
  --fg:#F1F1F1; --fg2:#C8C8C8; --dim:#8A8A8A;
  --ok:#5DB38A; --warn:#E3A63F; --crit:#E2654A; --info:#C8C8C8;
  --font:"N27","Montserrat","Century Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--fg2);outline-offset:2px}
.up{text-transform:uppercase;letter-spacing:.06em}
.num{font-variant-numeric:tabular-nums}

/* App shell */
#app{height:100%;display:grid;grid-template-rows:auto auto 1fr;gap:10px;min-height:0}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:18px;letter-spacing:.08em}
.brand small{font-weight:400;font-size:11px;color:var(--dim);letter-spacing:.1em}
.proto{font-size:10.5px;letter-spacing:.12em;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);padding:3px 8px;border-radius:999px}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tab{background:transparent;border:1px solid var(--line);padding:6px 10px;border-radius:8px;font-size:12px;display:flex;align-items:center;gap:6px;color:var(--fg2)}
.tab[aria-current="true"]{background:var(--panel2);border-color:var(--line2);color:var(--fg)}
.tab .cnt{font-size:10.5px;padding:1px 6px;border-radius:999px;background:var(--line);color:var(--fg)}
.tab .cnt.warn{background:color-mix(in srgb,var(--warn) 25%,transparent);color:var(--warn)}
.tab .cnt.crit{background:color-mix(in srgb,var(--crit) 25%,transparent);color:var(--crit)}
.tab:disabled{opacity:.45;cursor:default}
.user{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--fg2)}
.user b{color:var(--fg);font-weight:700}
.btn-ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:10.5px;color:var(--dim)}
.kpi .v{font-size:22px;font-weight:700;line-height:1.1}
.kpi .s{font-size:11px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.attn .v{color:var(--warn)}
.kpi.bad .v{color:var(--crit)}

.main{display:grid;grid-template-columns:260px minmax(0,1fr) 360px;gap:10px;min-height:0}
.side{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.side-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700}
.side-b{padding:12px 14px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:14px}

/* Feed */
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.feed li{display:grid;grid-template-columns:42px 1fr;gap:8px;font-size:12px;color:var(--fg2)}
.feed time{color:var(--dim);font-size:11px}
.feed .ev{border-left:2px solid var(--line2);padding-left:8px}
.feed .ev.ok{border-color:var(--ok)} .feed .ev.warn{border-color:var(--warn)} .feed .ev.crit{border-color:var(--crit)}
.feed .room{display:block;font-size:10px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}

/* Map */
.mapwrap{position:relative;background:radial-gradient(ellipse at 50% 40%,#1A1A1A 0%,var(--bg) 70%);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:0}
#map{width:100%;height:100%;display:block;touch-action:manipulation}
.map-hint{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--dim)}
.map-back{position:absolute;left:12px;top:10px}
svg.zoomed ~ .legend,svg.editing ~ .legend{display:none}
.legend{position:absolute;left:12px;top:16px;display:flex;gap:12px;font-size:11px;color:var(--fg2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.crit{background:var(--crit)} .dot.off{background:var(--dim)}

/* SVG pieces */
.floor{stroke:rgba(0,0,0,.14);stroke-width:1}
.room-hit{cursor:pointer}
.room-hit:hover .floor{filter:brightness(1.05)}
#map{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#map:active{cursor:grabbing}
#map.rotating{cursor:ew-resize}
svg.editing .agent.ghost{opacity:.65;cursor:pointer}
.mapctl{position:absolute;right:10px;top:10px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 20px)}
.mapctl button{min-width:34px;height:34px;background:rgba(17,17,17,.88);border:1px solid var(--line2);border-radius:8px;font-size:16px;line-height:1}
.mapctl .wide{font-size:12px;padding:0 12px;font-weight:700;letter-spacing:.06em}
.mapctl button[aria-pressed="true"]{background:var(--fg);color:#0D0D0D;border-color:var(--fg)}
.map-back{top:44px}
.map-hint{right:12px}
.glass{fill:rgba(210,228,236,.28);stroke:rgba(255,255,255,.55);stroke-width:.8}
.board{fill:#1B1B1B;stroke:#C8C8C8;stroke-width:1}
.board-t{fill:#F1F1F1;font-weight:700;font-size:15px;letter-spacing:.06em}
.board-s{fill:#C8C8C8;font-size:9px;letter-spacing:.1em}
.agent{cursor:pointer}
.agent .shadow{fill:rgba(0,0,0,.22)}
.agent .ring{fill:none;stroke-width:2.2}
.agent .vis{transition:transform .2s}
.agent:hover .vis,.agent.sel .vis{transform:translateY(-3px)}
.agent.ghost{opacity:.4;cursor:default}
.agent.ghost:hover .vis{transform:none}
.badge circle{stroke:#0D0D0D;stroke-width:1.5}
.badge text{fill:#0D0D0D;font-size:10px;font-weight:700}
.plate{opacity:0;transition:opacity .2s;pointer-events:none}
svg.zoomed .plate,.plate.sel{opacity:1}
.plate rect{fill:#0D0D0D;opacity:.86}
.plate text{fill:#F1F1F1;font-size:9.5px;letter-spacing:.05em}
.pill rect.bg{fill:#111;stroke:#3A3A3A}
.pill .t{fill:#F1F1F1;font-size:12px;font-weight:700;letter-spacing:.08em}
.pill .s{fill:#B5B5B5;font-size:10px}
.lock-t{fill:#F1F1F1;font-size:12px;font-weight:700;letter-spacing:.12em}
@media (prefers-reduced-motion:no-preference){
  .agent:not(.ghost) .bob{animation:bob 2.6s ease-in-out infinite}
  .agent:nth-of-type(2n) .bob{animation-delay:-1.1s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
  .pulse{animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
}

/* Right panel content */
.sec-t{font-size:10.5px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px}
.wait{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.wait button{width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.wait button:hover{border-color:var(--line2)}
.wait .ic{grid-row:span 2;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--line);color:var(--fg)}
.wait .ic.warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.wait .ic.crit{background:color-mix(in srgb,var(--crit) 22%,transparent);color:var(--crit)}
.wait .tt{font-size:13px;font-weight:700;color:var(--fg)}
.wait .dd{font-size:11.5px;color:var(--dim)}
.team{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.team button{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:8px 2px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;text-align:left;align-items:center}
.team button:hover .nm{text-decoration:underline}
.team .nm{font-size:12.5px;font-weight:700}
.team .rm{font-size:11px;color:var(--dim);grid-column:2}
.team .bd{grid-row:span 2;font-size:11px;color:var(--fg2)}
.team .dot{grid-row:span 2}
.empty{font-size:12px;color:var(--dim);background:var(--panel2);border:1px dashed var(--line2);border-radius:10px;padding:12px}
.back{background:transparent;border:0;color:var(--fg2);font-size:12px;padding:0;display:inline-flex;gap:6px;align-items:center}
.h2{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:0}
.sub{font-size:12px;color:var(--dim);margin:2px 0 0}

.m{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.m .l{font-size:10.5px;color:var(--dim)} .m .v{font-size:18px;font-weight:700}
.m.warn .v{color:var(--warn)} .m.crit .v{color:var(--crit)} .m.ok .v{color:var(--ok)}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:110px 1fr 28px;gap:8px;align-items:center;font-size:12px;color:var(--fg2)}
.bar .tr{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar .fl{height:100%;background:var(--warn);border-radius:4px}
.bar .n{text-align:right;color:var(--fg)}
.report{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;color:var(--fg2);display:flex;flex-direction:column;gap:8px}
.report ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.meta{font-size:11px;color:var(--dim);display:flex;gap:10px;flex-wrap:wrap}
.draft{white-space:pre-wrap;background:#0F0F0F;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12.5px;line-height:1.55;color:var(--fg2);max-height:340px;overflow:auto}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:700}
.btn.pri{background:var(--fg);color:#0D0D0D;border-color:var(--fg)}
.btn:hover{filter:brightness(1.1)}
.link{color:var(--fg);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:#0D0D0D;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:700;z-index:20}

/* Editor */
.ehead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.seg{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;background:transparent;border:0;border-radius:7px;padding:7px 8px;font-size:12px;color:var(--fg2)}
.seg button[aria-pressed="true"]{background:var(--line2);color:var(--fg);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 6px;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.chip i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.25)}
.chip[aria-pressed="true"]{border-color:var(--fg);color:var(--fg)}
.crow{display:flex;flex-direction:column;gap:6px}
.cl{font-size:11px;color:var(--fg2);letter-spacing:.08em;text-transform:uppercase}
.sw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.swb{width:24px;height:24px;border-radius:6px;border:1px solid rgba(255,255,255,.18);padding:0}
.swb[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:2px}
.sw input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--line2);border-radius:6px;background:transparent;cursor:pointer}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px}
.opts button[aria-pressed="true"]{border-color:var(--fg);color:var(--fg);font-weight:700}
.hr{border:0;border-top:1px solid var(--line);margin:0}

/* Login */
#login{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,#1C1C1C,#0B0B0B 70%);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lcard{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:14px}
.lcard h1{margin:0;font-size:22px;letter-spacing:.1em}
.lcard p{margin:0;font-size:12.5px;color:var(--dim)}
.fld{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--fg2);letter-spacing:.08em;text-transform:uppercase}
.fld input{background:#0F0F0F;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;color:var(--fg);font-family:inherit;font-size:14px;letter-spacing:0;text-transform:none}
.err{color:var(--crit);font-size:12.5px;min-height:1em}
.demo{display:flex;flex-direction:column;gap:6px}
.demo button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:left;font-size:12px;display:flex;justify-content:space-between;gap:8px}
.demo button span{color:var(--dim)}

@media (max-width:1100px){
  .main{grid-template-columns:minmax(0,1fr) 340px}
  .feedcol{display:none}
}
@media (max-width:760px){
  html,body{height:auto}
  #app{height:auto}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:first-child{grid-column:span 2}
  .main{grid-template-columns:minmax(0,1fr)}
  .mapwrap{height:52vh;min-height:320px;order:-1}
  .feedcol{display:flex}
  .feedcol .side-b{max-height:320px}
  .user{margin-left:0;width:100%;justify-content:space-between}
  .legend{display:none}
}
</style>
</head>
<body>

<section id="login" aria-label="Entrar no hub">
  <form class="lcard" id="loginForm" novalidate>
    <div>
      <h1>DBVO HUB</h1>
      <p>Central dos projetos e agentes da DBVO. Entre com o e-mail e a senha cadastrados.</p>
    </div>
        <label class="fld" for="lemail">E-mail
      <input id="lemail" type="email" autocomplete="username" placeholder="nome@empresa.com.br">
    </label>
    <label class="fld" for="lsenha">Senha
      <input id="lsenha" type="password" autocomplete="current-password" placeholder="••••••">
    </label>
    <div class="err" id="lerr" role="alert"></div>
    <button class="btn pri" type="submit" id="lentrar">Entrar</button>
    <button type="button" class="link" id="lforgot" style="background:none;border:0;padding:0;text-align:left">Esqueci minha senha</button>
  </form>
</section>

<div id="app" hidden>
  <header class="topbar">
    <div class="brand">DBVO HUB <small>ESCRITÓRIO DE AGENTES</small></div>
    <span class="proto up" id="sync" style="color:var(--fg2);border-color:var(--line2)">Conectando…</span>
    <nav class="tabs" id="tabs" aria-label="Salas"></nav>
    <div class="user"><span>Conectado como <b id="uname"></b> · <span id="urole"></span></span><button class="btn-ghost" id="logout">Sair</button></div>
  </header>
  <section class="kpis" id="kpis" aria-label="Indicadores"></section>
  <div class="main">
    <aside class="side feedcol" aria-label="Atividade recente">
      <div class="side-h up">Atividade recente</div>
      <div class="side-b"><ul class="feed" id="feed"></ul></div>
    </aside>
    <div class="mapwrap">
      <svg id="map" role="img" aria-label="Mapa do escritório com as salas dos projetos e os agentes"></svg>
      <div class="mapctl" role="toolbar" aria-label="Controles do mapa">
        <button data-ctl="zin" aria-label="Aproximar" title="Aproximar">+</button>
        <button data-ctl="zout" aria-label="Afastar" title="Afastar">−</button>
        <button data-ctl="rl" aria-label="Girar para a esquerda" title="Girar para a esquerda">⟲</button>
        <button data-ctl="rr" aria-label="Girar para a direita" title="Girar para a direita">⟳</button>
        <button data-ctl="fit" aria-label="Ver o escritório inteiro" title="Ver o escritório inteiro">⤢</button>
        <button data-ctl="edit" class="wide up" id="ctlEdit" aria-pressed="false">Personalizar</button>
      </div>
      <button class="btn-ghost map-back" id="mapBack" hidden>Voltar ao escritório</button>
      <div class="map-hint" id="mapHint">Arraste para mover. Roda do mouse: zoom. Segure a rodinha (ou Shift) e arraste para girar.</div>
      <div class="legend"><span><i class="dot ok"></i>Em dia</span><span><i class="dot warn"></i>Atenção</span><span><i class="dot crit"></i>Crítico</span><span><i class="dot off"></i>Em breve</span></div>
    </div>
    <aside class="side" aria-label="Painel">
      <div class="side-b" id="panel"></div>
    </aside>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
/* ======================= Firebase do hub ======================= */
firebase.initializeApp({
  apiKey: "AIzaSyAQqW9ceuZ9wG01NlRncyFSqcLFPtp_wHs",
  authDomain: "hubia-dbvo.firebaseapp.com",
  projectId: "hubia-dbvo",
  storageBucket: "hubia-dbvo.firebasestorage.app",
  messagingSenderId: "780856756658",
  appId: "1:780856756658:web:4a29ba09c24789468cfcab"
});
const fbAuth = firebase.auth();
const db = firebase.firestore();
const TODAS_SALAS = ["pde", "central", "uau", "fin"];
const HORAS_SEM_SINAL = 3;

const ROOMS = [
  { id:"pde", nome:"PDE", x0:0, y0:0, x1:11, y1:7, link:"https://pdedbvo.github.io/Processo-De-Desenvolvimento-de-Empreendimento/", fonte:"Firebase bemf-pde · coleções tasks, emailQueue, emailLogs" },
  { id:"central", nome:"Central de Serviços", x0:12, y0:0, x1:24, y1:7, link:"https://pdedbvo.github.io/CentralDeServicos/#/painel", fonte:"Firebase centraldeservicos-3bfa7 · coleções requests, departments, email_status" },
  { id:"uau", nome:"Agente UAU", x0:0, y0:9, x1:7.5, y1:16, soon:true },
  { id:"fin", nome:"Financeiro", x0:8.5, y0:9, x1:15.5, y1:16, soon:true },
  { id:"sala", nome:"Sua sala", x0:16.5, y0:9, x1:24, y1:16, own:true }
];

/* Os números de cada sala chegam do coletor (snapshots) e são aplicados por applyPDE/applyCentral */
const ROOM_DATA = {};
const EMPTY_ROOM = { resumo:"Aguardando a primeira coleta.", metricas:[["-",0,""],["-",0,""],["-",0,""],["-",0,""],["-",0,""],["-",0,""]], barrasTitulo:"", barras:[], nota:"", atualizadoEm:0 };
const rd = (id) => ROOM_DATA[id] || EMPTY_ROOM;
const AGENTS = [
  { id:"pde-monitor", room:"pde", nome:"Monitor de cards", funcao:"Acompanha status e prazos" },
  { id:"pde-cobrador", room:"pde", nome:"Cobrador", funcao:"Identifica cards parados" },
  { id:"pde-redator", room:"pde", nome:"Redator", funcao:"Vai preparar o e-mail semanal" },
  { id:"pde-carteiro", room:"pde", nome:"Carteiro", funcao:"Monitora a fila de e-mails" },
  { id:"cs-triagem", room:"central", nome:"Triagem", funcao:"Acha tickets sem responsável" },
  { id:"cs-prazos", room:"central", nome:"Prazos", funcao:"Vigia tickets atrasados" },
  { id:"cs-carteiro", room:"central", nome:"Carteiro", funcao:"Confere os e-mails automáticos" },
  { id:"uau-robo", room:"uau", nome:"Robô 953", funcao:"Em breve", ghost:true },
  { id:"uau-2", room:"uau", nome:"Conferente", funcao:"Em breve", ghost:true },
  { id:"fin-1", room:"fin", nome:"Caixa", funcao:"Em breve", ghost:true },
  { id:"fin-2", room:"fin", nome:"DRE", funcao:"Em breve", ghost:true }
];
AGENTS.forEach((a) => Object.assign(a, { status:"ok", badge:0, ultima:"-", relatorio:"Aguardando a primeira coleta.", pontos:[], acao:null }));
const WAITING = [];
const FEED = [];
const SNAP = {};

const toMs = (x) => !x ? 0 : typeof x.toMillis === "function" ? x.toMillis() : new Date(x).getTime();
const fmtHora = (ms) => ms ? new Date(ms).toLocaleString("pt-BR", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" }) : "-";
const hhmm = (ms) => ms ? new Date(ms).toLocaleTimeString("pt-BR", { hour:"2-digit", minute:"2-digit" }) : "-";
const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
const fmtData = (iso) => iso ? String(iso).slice(0, 10).split("-").reverse().join("/") : "sem data";
function agentSet(id, o) { Object.assign(agentById(id), o); }
function semSinal(ms) { return !ms || Date.now() - ms > HORAS_SEM_SINAL * 3600e3; }
function grupo(lista, chave) { const m = {}; lista.forEach((x) => { (m[x[chave]] = m[x[chave]] || []).push(x); }); return m; }

function applyPDE(s) {
  const t = s.totais || {}, ms = toMs(s.atualizadoEm), quando = fmtHora(ms);
  ROOM_DATA.pde = {
    resumo: `${plural(t.atraso, "card em atraso", "cards em atraso")}${t.atrasoCaminhoCritico ? `, ${t.atrasoCaminhoCritico} no caminho crítico` : ""}. ${plural(t.semAtualizacao, "card sem atualização", "cards sem atualização")} há mais de 14 dias.`,
    metricas: [["Em andamento", t.andamento, ""], ["Em atraso", t.atraso, t.atraso ? "crit" : "ok"], ["Pendentes", t.pendentes, ""],
               ["Concluídos em 7 dias", t.concluidos7d, "ok"], ["Sem atualização 14d", t.semAtualizacao, t.semAtualizacao ? "warn" : "ok"], ["E-mails em 7 dias", t.emails7d, t.filaParada ? "warn" : "ok"]],
    barrasTitulo: "Atrasos por empreendimento",
    barras: (s.atrasoPorEmpreendimento || []).slice(0, 6).map((b) => [b.nome, b.total]),
    nota: `BE04 e cards arquivados ficam fora. Coletado em ${quando}.`, atualizadoEm: ms
  };
  const atr = s.listaAtrasados || [], par = s.listaParados || [];
  agentSet("pde-monitor", { status: t.atrasoCaminhoCritico ? "crit" : t.atraso ? "warn" : "ok", badge: t.atraso, ultima: quando,
    relatorio: t.atraso ? `${plural(t.atraso, "card está em atraso", "cards estão em atraso")}${t.atrasoCaminhoCritico ? `, ${t.atrasoCaminhoCritico} no caminho crítico` : ""}. Os mais urgentes:` : "Nenhum card em atraso.",
    pontos: atr.slice(0, 6).map((c) => `${c.empreendimento}: ${c.titulo} (${plural(c.diasAtraso, "dia", "dias")}${c.caminhoCritico ? ", caminho crítico" : ""})`)
      .concat(t.concluidos7d ? [`${plural(t.concluidos7d, "card concluído", "cards concluídos")} em 7 dias${t.concluidosComAtraso7d ? `, ${t.concluidosComAtraso7d} com atraso` : ""}`] : []) });
  agentSet("pde-cobrador", { status: t.semAtualizacao ? "warn" : "ok", badge: t.semAtualizacao, ultima: quando, acao: t.semAtualizacao ? "w-pde-cobranca" : null,
    relatorio: t.semAtualizacao ? `${plural(t.semAtualizacao, "card em andamento está", "cards em andamento estão")} sem atualização há mais de 14 dias.` : "Todos os cards em andamento foram atualizados nas últimas 2 semanas.",
    pontos: (s.paradosPorSetor || []).slice(0, 8).map((x) => `${x.nome}: ${plural(x.total, "card", "cards")}`) });
  agentSet("pde-redator", { status:"ok", badge:0, ultima:"-", relatorio:"O e-mail semanal escrito pela IA entra na fase dos agentes. Por enquanto este agente só observa.", pontos:[] });
  agentSet("pde-carteiro", { status: t.filaParada ? "warn" : "ok", badge: t.filaParada, ultima: quando,
    relatorio: t.filaParada ? `${plural(t.filaParada, "e-mail está parado", "e-mails estão parados")} na fila há mais de 1 hora.` : "Fila de e-mails do PDE em dia.",
    pontos: [`${plural(t.emails7d, "e-mail enviado", "e-mails enviados")} em 7 dias`, `Último envio: ${fmtHora(toMs(s.ultimoEmailEm))}`] });
  const items = [];
  if (t.semAtualizacao) {
    const g = grupo(par, "setor");
    items.push({ id:"w-pde-cobranca", room:"pde", agente:"pde-cobrador", sev:"warn", tipo:"COBRANÇA", titulo:`Cobrar ${plural(Object.keys(g).length, "área", "áreas")} com cards parados`,
      detalhe:`${plural(t.semAtualizacao, "card", "cards")} sem atualização há mais de 14 dias`, para:`Responsáveis de ${Object.keys(g).join(", ")}`, assunto:"PDE | Cards sem atualização",
      corpo:"Olá,\n\nIdentificamos cards do PDE sob responsabilidade da sua área sem atualização há mais de 14 dias. Pedimos que atualizem o status e a previsão de cada um.\n\n" +
        Object.keys(g).map((k) => k.toUpperCase() + "\n" + g[k].map((c) => `* ${c.empreendimento}, ${c.titulo}: ${c.diasSemAtualizar} dias sem atualização`).join("\n")).join("\n\n") +
        (par.length < t.semAtualizacao ? `\n\n(Aqui estão ${par.length} de ${t.semAtualizacao}. A lista completa está no PDE.)` : "") + "\n\nAtenciosamente." });
  }
  return { items, feed: [[hhmm(ms), "pde", `Monitor: ${plural(t.atraso, "card em atraso", "cards em atraso")}`, t.atrasoCaminhoCritico ? "crit" : t.atraso ? "warn" : "ok"],
                         [hhmm(ms), "pde", `Cobrador: ${plural(t.semAtualizacao, "card parado", "cards parados")} há 14 dias ou mais`, t.semAtualizacao ? "warn" : "ok"],
                         [hhmm(ms), "pde", `Carteiro: ${plural(t.emails7d, "e-mail", "e-mails")} em 7 dias`, t.filaParada ? "warn" : "ok"]] };
}

function applyCentral(s) {
  const t = s.totais || {}, ms = toMs(s.atualizadoEm), quando = fmtHora(ms);
  const porArea = s.atrasadasPorArea || [];
  ROOM_DATA.central = {
    resumo: `${plural(t.atrasadas, "ticket atrasado", "tickets atrasados")}${porArea[0] ? `, ${porArea[0].nome} concentra ${porArea[0].total}` : ""}. ${plural(t.semResponsavel, "ticket aberto", "tickets abertos")} sem responsável.`,
    metricas: [["Abertos", t.abertas, ""], ["Em andamento", t.andamento, ""], ["Atrasados", t.atrasadas, t.atrasadas ? "crit" : "ok"],
               ["Aguardando informações", t.aguardando, t.aguardando ? "warn" : ""], ["Concluídos em 7 dias", t.concluidas7d, "ok"], ["Sem responsável", t.semResponsavel, t.semResponsavel ? "warn" : "ok"]],
    barrasTitulo: "Atrasados por área", barras: porArea.slice(0, 6).map((b) => [b.nome, b.total]),
    nota: `Cadastro fiscal: ${t.cadastroFiscal}. Coletado em ${quando}.`, atualizadoEm: ms
  };
  const atr = s.listaAtrasadas || [], semR = s.listaSemResponsavel || [], emails = s.emails || [];
  const comErro = emails.filter((e) => !e.ok);
  agentSet("cs-triagem", { status: t.semResponsavel ? "warn" : "ok", badge: t.semResponsavel, ultima: quando, acao: t.semResponsavel ? "w-cs-atribuir" : null,
    relatorio: t.semResponsavel ? `${plural(t.semResponsavel, "ticket aberto ainda não tem", "tickets abertos ainda não têm")} responsável. Os mais antigos:` : "Todos os tickets abertos têm responsável.",
    pontos: semR.slice(0, 6).map((r) => `#${r.codigo} ${r.titulo} · ${r.area}`) });
  agentSet("cs-prazos", { status: t.atrasadas >= 5 ? "crit" : t.atrasadas ? "warn" : "ok", badge: t.atrasadas, ultima: quando, acao: t.atrasadas ? "w-cs-cobranca" : null,
    relatorio: t.atrasadas ? `${plural(t.atrasadas, "ticket passou", "tickets passaram")} do prazo${atr[0] ? `. O mais antigo está atrasado há ${plural(atr[0].diasAtraso, "dia", "dias")}` : ""}.` : "Nenhum ticket atrasado.",
    pontos: porArea.slice(0, 8).map((x) => `${x.nome}: ${x.total}`) });
  agentSet("cs-carteiro", { status: comErro.length ? "crit" : t.emailsPendentes ? "warn" : "ok", badge: comErro.length + (t.emailsPendentes ? 1 : 0), ultima: quando, acao: comErro.length ? "w-cs-email" : null,
    relatorio: comErro.length ? `${plural(comErro.length, "tipo de e-mail automático está", "tipos de e-mail automático estão")} com erro.` : "E-mails automáticos funcionando.",
    pontos: emails.map((e) => `${e.regra}: ${e.ok ? "OK" : "erro"}${e.enviadosUltimaExecucao ? ` · ${e.enviadosUltimaExecucao} na última execução` : ""}${e.pendentes ? ` · ${e.pendentes} na fila` : ""}`) });
  const items = [];
  if (t.atrasadas) {
    const g = grupo(atr, "area");

/* Itens que você marcou como resolvidos somem até a próxima coleta trazer de novo */
function vistos() { try { return JSON.parse(localStorage.getItem("dbvohub.vistos") || "{}"); } catch (e) { return {}; } }
function rebuild() {
  const v = vistos(), items = [], fd = [];
  ["pde", "central"].forEach((id) => {
    if (!SNAP[id] || !can(id)) return;
    const r = (id === "pde" ? applyPDE : applyCentral)(SNAP[id]);
    const ms = toMs(SNAP[id].atualizadoEm);
    r.items.forEach((w) => { if (v[w.id] !== ms) items.push(w); });
    if (semSinal(ms)) fd.push([hhmm(ms), id, `Coletor sem atualizar esta sala desde ${fmtHora(ms)}`, "crit"]);
    fd.push(...r.feed);
  });
  S.waiting = items.sort((a, b) => (b.sev === "crit") - (a.sev === "crit"));
  S.feed = S.localFeed.concat(fd);
}

/* ======================= Mapa isométrico (giro livre) ======================= */
let PLATES = [];
const TW = 30, TH = 15, GW = 24, GD = 16, CX = GW / 2, CY = GD / 2;
const Praw = (x, y, z = 0) => [(x - y) * TW, (x + y) * TH - z];
function rotPt(x, y) {
  const t = (S.ang * Math.PI) / 180, c = Math.cos(t), s = Math.sin(t), dx = x - CX, dy = y - CY;
  return [CX + dx * c - dy * s, CY + dx * s + dy * c];
}
const P = (x, y, z = 0) => { const [rx, ry] = rotPt(x, y); return Praw(rx, ry, z); };
const quadR = (x0, y0, x1, y1) => [rotPt(x0, y0), rotPt(x1, y0), rotPt(x1, y1), rotPt(x0, y1)];
const pts = (arr) => arr.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
const poly = (arr, cls, extra = "") => `<polygon points="${pts(arr)}" class="${cls}" ${extra}/>`;
const polyF = (arr, fill, cls = "") => `<polygon points="${pts(arr)}" fill="${fill}" class="${cls}"/>`;
function edges(q) {
  return q.map((a, i) => {
    const b = q[(i + 1) % 4], dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1;
    return { a, b, nx:dy / L, ny:-dx / L, i };

}
/* Caixa com faces visíveis calculadas pelo ângulo atual */
function prism(q, h, base, z0 = 0) {
  let out = "";
  edges(q).forEach(({ a, b, nx, ny }) => {
    if (nx + ny > 1e-6) out += polyF([Praw(a[0], a[1], z0), Praw(b[0], b[1], z0), Praw(b[0], b[1], z0 + h), Praw(a[0], a[1], z0 + h)], shade(base, 0.65 + 0.07 * (ny - nx)));

}
function box(x, y, w, d, h, base, z0 = 0) { return prism(quadR(x, y, x + w, y + d), h, base, z0); }
const deskC = () => LOOK.theme.mesas;
const MONC = "#1E1E1E";
function deskSpots(r, n) {
  const spots = [];
  const cols = 2, gx = (r.x1 - r.x0) / cols;
  for (let i = 0; i < n; i++) {
    const c = i % cols, row = Math.floor(i / cols);
    spots.push([r.x0 + c * gx + gx / 2 - 1, r.y0 + 0.9 + row * 2.7]);
  }

}
function hairSVG(l, sx, hy) {

  if (l.style === "careca") return { back:"", front:"" };
  if (l.style === "longo") return { back:`<rect x="${sx - 7.4}" y="${hy - 3}" width="14.8" height="12.5" rx="4" fill="${l.hair}"/>`, front:cap };

}
function accSVG(l, sx, hy) {

function agentSVG(a, x, y) {

    <ellipse class="shadow" cx="${sx}" cy="${sy}" rx="11" ry="5.5"/>

/* TV pendurada na parede mais ao fundo da sala, no ângulo atual */
function board(r, big, small) {
  const back = edges(quadR(r.x0, r.y0, r.x1, r.y1)).sort((e1, e2) => (e1.nx + e1.ny) - (e2.nx + e2.ny))[0];
  let a = back.a, b = back.b;
  const sa = Praw(a[0], a[1]), sb = Praw(b[0], b[1]);
  if (sb[0] < sa[0]) { const t = a; a = b; b = t; }
  const L = Math.hypot(b[0] - a[0], b[1] - a[1]), ux = (b[0] - a[0]) / L, uy = (b[1] - a[1]) / L;
  const at = (k) => [a[0] + ux * k, a[1] + uy * k];
  const p0 = at(0.9), p1 = at(4.5), z = 24, h = 34;
  const quad = [Praw(p0[0], p0[1], z), Praw(p1[0], p1[1], z), Praw(p1[0], p1[1], z + h), Praw(p0[0], p0[1], z + h)];
  const v = [quad[1][0] - quad[0][0], quad[1][1] - quad[0][1]], vl = Math.hypot(v[0], v[1]) || 1;
  const m = (zz) => { const q = at(1.25); const [ex, ey] = Praw(q[0], q[1], zz); return `matrix(${(v[0] / vl * 1.1).toFixed(3)},${(v[1] / vl * 1.1).toFixed(3)},0,1,${ex.toFixed(1)},${ey.toFixed(1)})`; };
  return poly(quad, "board") +
    `<text class="board-s" transform="${m(z + h - 10)}">${esc(small)}</text>` +
    `<text class="board-t" transform="${m(z + h - 28)}">${esc(big)}</text>`;
}
function roomPill(r) {
  const q = quadR(r.x0, r.y0, r.x1, r.y1);
  const c = q.reduce((m, p) => (Praw(p[0], p[1])[0] < Praw(m[0], m[1])[0] ? p : m), q[0]);
  const ctr = rotPt((r.x0 + r.x1) / 2, (r.y0 + r.y1) / 2), dl = Math.hypot(ctr[0] - c[0], ctr[1] - c[1]) || 1;
  const [sx, sy] = Praw(c[0] + (ctr[0] - c[0]) / dl * 0.7, c[1] + (ctr[1] - c[1]) / dl * 0.7);
  let sub = "";
  if (r.soon) sub = "Em breve";
  else if (r.own) sub = `${myWaiting().length} esperando você`;
  else if (!can(r.id)) sub = "Sem acesso";
  else sub = rd(r.id).metricas.filter((m) => m[2] === "crit").map((m) => `${m[1]} ${m[0].toLowerCase()}`).join(" · ");
  const t = r.nome.toUpperCase();
  const w = Math.max(t.length * 8.2, sub.length * 5.6) + 30;
  return `<g class="pill" transform="translate(${(sx - 6).toFixed(1)},${(sy - 18).toFixed(1)})"><rect class="bg" x="0" y="0" width="${w}" height="36" rx="8"/>
    <rect x="8" y="9" width="4" height="18" rx="2" fill="${LOOK.floors[r.id]}"/>
    <text class="t" x="18" y="15">${esc(t)}</text><text class="s" x="18" y="28">${esc(sub)}</text></g>`;
}
function onBoundary(e, r) {
  const a = [[r.x0, r.y0], [r.x1, r.y0], [r.x1, r.y1], [r.x0, r.y1]][e.i], b = [[r.x1, r.y0], [r.x1, r.y1], [r.x0, r.y1], [r.x0, r.y0]][e.i];
  return (a[0] === b[0] && (a[0] <= 0 || a[0] >= GW)) || (a[1] === b[1] && (a[1] <= 0 || a[1] >= GD));
}
function drawMap() {
  const svg = $("#map");
  PLATES = [];
  const T = LOOK.theme;
  $(".mapwrap").style.background = T.mapa;
  let out = "";
  const bq = quadR(0, 0, GW, GD), be = edges(bq);
  // laje (faces da frente) e piso do corredor
  be.forEach(({ a, b, nx, ny }) => { if (nx + ny > 1e-6) out += polyF([Praw(a[0], a[1], 0), Praw(b[0], b[1], 0), Praw(b[0], b[1], -14), Praw(a[0], a[1], -14)], shade("#3A3A38", 0.9 + 0.12 * (ny - nx))); });
  out += polyF(bq.map((p) => Praw(p[0], p[1])), T.corredor);
  // paredes externas: só as que ficam ao fundo no ângulo atual
  be.forEach(({ a, b, nx, ny }) => {
    if (nx + ny < -1e-6) {
      out += polyF([Praw(a[0], a[1], 0), Praw(b[0], b[1], 0), Praw(b[0], b[1], 64), Praw(a[0], a[1], 64)], shade(T.paredes, 0.9 + 0.1 * (nx - ny)));
      out += `<polyline points="${pts([Praw(a[0], a[1], 64), Praw(b[0], b[1], 64)])}" fill="none" stroke="${shade(T.paredes, 1.35)}" stroke-width="3"/>`;
    }
  });
  // pisos das salas
  ROOMS.forEach((r) => {
    const q = quadR(r.x0, r.y0, r.x1, r.y1).map((p) => Praw(p[0], p[1]));
    const veil = r.soon ? 0.3 : !r.own && !can(r.id) ? 0.5 : 0;
    out += `<g class="room-hit" data-room="${r.id}" role="button" tabindex="0" aria-label="Sala ${esc(r.nome)}">` +
      polyF(q, LOOK.floors[r.id], "floor") + (veil ? `<polygon points="${pts(q)}" fill="#000" opacity="${veil}"/>` : "") + `</g>`;
  });
  // vidros internos: os do fundo antes dos móveis, os da frente depois
  const glassBack = [], glassFront = [];
  ROOMS.forEach((r) => {
    edges(quadR(r.x0, r.y0, r.x1, r.y1)).forEach((e) => {
      if (onBoundary(e, r)) return;
      const g = poly([Praw(e.a[0], e.a[1], 0), Praw(e.b[0], e.b[1], 0), Praw(e.b[0], e.b[1], 20), Praw(e.a[0], e.a[1], 20)], "glass");
      (e.nx + e.ny < 0 ? glassBack : glassFront).push(g);

  // TVs
  if (can("pde")) out += board(roomById("pde"), `${rd("pde").metricas[1][1]} ATRASO`, "CARDS PDE");
  if (can("central")) out += board(roomById("central"), `${rd("central").metricas[2][1]} ATRASO`, "TICKETS");
  out += board(roomById("sala"), `${myWaiting().length} AGUARDANDO`, "ESPERANDO VOCÊ");
  // mesas e agentes, ordenados por profundidade no ângulo atual
  const items = [];
  const depth = (x, y) => { const [a, b] = rotPt(x, y); return a + b; };
  ROOMS.forEach((r) => {
    const ags = AGENTS.filter((a) => a.room === r.id);
    if (r.own) {
      const x = r.x0 + 2.6, y = r.y0 + 2.4;
      items.push({ d: depth(x + 1.2, y + 0.55), s: box(x, y, 2.4, 1.1, 14, deskC()) + box(x + 0.7, y + 0.1, 1, 0.18, 12, MONC, 14) });
      const me = { id:"me", nome: S.user ? S.user.nome : "Você", status:"", badge: myWaiting().length };
      items.push({ d: depth(x + 1.2, y + 1.9), s: agentSVG(me, x + 1.2, y + 1.9).replace('data-agent="me"', 'data-agent="me" data-room="sala"') });
      items.push({ d: depth(r.x0 + 5.1, r.y0 + 5.3), s: box(r.x0 + 3.6, r.y0 + 4.4, 3, 1.8, 10, deskC()) });
      return;
    }
    if (!r.soon && !can(r.id)) return;
    deskSpots(r, ags.length).forEach(([x, y], i) => {
      const a = ags[i];
      items.push({ d: depth(x + 1, y + 0.45), s: box(x, y, 2, 0.9, 14, deskC()) + box(x + 0.55, y + 0.08, 0.9, 0.16, 12, MONC, 14) });
      items.push({ d: depth(x + 1, y + 1.75), s: agentSVG(a, x + 1, y + 1.75) });

  });
  items.sort((a, b) => a.d - b.d).forEach((it) => (out += it.s));
  out += glassFront.join("");
  ROOMS.forEach((r) => {
    if (!r.soon && !r.own && !can(r.id)) {
      const [cx, cy] = P((r.x0 + r.x1) / 2, (r.y0 + r.y1) / 2);
      out += `<text class="lock-t" x="${cx}" y="${cy}" text-anchor="middle">SEM ACESSO</text>`;
    }
  });
  out += PLATES.join("");
  ROOMS.forEach((r) => (out += roomPill(r)));
  svg.innerHTML = out;
  svg.classList.toggle("editing", S.view.mode === "edit");

}
function bboxOf(c, pad, extraB = 0) {
  const xs = c.map((p) => p[0]), ys = c.map((p) => p[1]);
  return [Math.min(...xs) - pad, Math.min(...ys) - pad, Math.max(...xs) - Math.min(...xs) + pad * 2, Math.max(...ys) - Math.min(...ys) + pad * 2 + extraB];
}
function fullBox() {

}
function roomBox(r) {

  if (t.dataset.epick) { S.view = { mode:"edit", tab:"agentes", agent:t.dataset.epick }; return render(); }
  if (t.dataset.etab) { S.view = { mode:"edit", tab:t.dataset.etab, agent:S.view.agent }; return panel(); }
  if (t.dataset.preset) { const p = PRESETS[t.dataset.preset]; LOOK.theme = { ...p.theme }; LOOK.floors = { ...p.floors }; saveLook(); drawMap(); return panel(); }
  if (t.dataset.reset) {
    if (t.dataset.reset === "1") { S.resetArm = true; return panel(); }
    S.resetArm = false; LOOK = { theme:{ ...DEFAULT_THEME }, floors:{ ...DEFAULT_FLOORS }, agents:{} }; saveLook(); toast("Visual padrão restaurado."); return render();
  }
  if (t.dataset.approve) return decide(t.dataset.approve);
  if (t.dataset.copy) return copyItem(t.dataset.copy);
  if (t.dataset.item) { S.view = { mode:"item", id:t.dataset.item }; return render(); }
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.tab) return t.dataset.tab === "home" ? go("home") : openRoom(t.dataset.tab);
  if (t.dataset.agent) return openAgent(t.dataset.agent);
  if (t.dataset.room) return openRoom(t.dataset.room);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.zoom) return go("home");
  if (e.key !== "Enter" && e.key !== " ") return;
  const t = e.target.closest && e.target.closest("svg [data-agent],svg [data-room]");
  if (!t) return;
  e.preventDefault(); t.dispatchEvent(new MouseEvent("click", { bubbles:true }));
});
$("#mapBack").addEventListener("click", () => go("home"));
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.setin) { const [a, k] = t.dataset.setin.split("|"); setLook(a, k, t.value); }
  if (t.dataset.name) { lookOf(t.dataset.name).nome = t.value.trim(); saveLook(); drawMap(); }
});
document.addEventListener("change", (e) => { if (e.target.dataset.setin) panel(); });
initPanZoom();
window.addEventListener("resize", kpis);

/* ======================= Login (Firebase) ======================= */
let unsubs = [];
const ERROS = { "auth/invalid-credential":"E-mail ou senha incorretos.", "auth/wrong-password":"E-mail ou senha incorretos.", "auth/user-not-found":"E-mail ou senha incorretos.",
  "auth/too-many-requests":"Muitas tentativas. Espere alguns minutos e tente de novo.", "auth/invalid-email":"Esse e-mail não é válido.", "auth/network-request-failed":"Sem conexão. Confira a internet." };
["lemail", "lsenha"].forEach((id) => $("#" + id).addEventListener("input", () => ($("#lerr").textContent = "")));
$("#loginForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const em = $("#lemail").value.trim(), pw = $("#lsenha").value;
  if (!em || !pw) { $("#lerr").textContent = "Preencha e-mail e senha."; return; }
  $("#lentrar").disabled = true; $("#lentrar").textContent = "Entrando…";
  fbAuth.signInWithEmailAndPassword(em, pw).catch((err) => { $("#lerr").textContent = ERROS[err.code] || "Não foi possível entrar: " + err.message; })
    .finally(() => { $("#lentrar").disabled = false; $("#lentrar").textContent = "Entrar"; });
});
$("#lforgot").addEventListener("click", () => {
  const em = $("#lemail").value.trim();
  if (!em) { $("#lerr").textContent = "Digite seu e-mail acima e clique de novo em Esqueci minha senha."; return; }
  fbAuth.sendPasswordResetEmail(em).then(() => toast("Se o e-mail estiver cadastrado, o link para nova senha chega em instantes."), (err) => { $("#lerr").textContent = ERROS[err.code] || err.message; });
});
$("#logout").addEventListener("click", () => fbAuth.signOut());

fbAuth.onAuthStateChanged(async (u) => {
  unsubs.forEach((f) => f()); unsubs = [];
  Object.keys(SNAP).forEach((k) => delete SNAP[k]); Object.keys(ROOM_DATA).forEach((k) => delete ROOM_DATA[k]);
  if (!u) { S.user = null; $("#app").hidden = true; $("#login").hidden = false; $("#lsenha").value = ""; return; }
  let perfil;
  try { const d = await db.collection("usuarios").doc(u.uid).get(); perfil = d.exists ? d.data() : null; }
  catch (err) { perfil = null; }
  if (!perfil) {
    $("#lerr").textContent = `Seu login funciona, mas o acesso ao hub ainda não foi liberado. Peça ao administrador para cadastrar o código ${u.uid}.`;
    fbAuth.signOut(); return;
  }
  const master = perfil.papel === "master";
  S.user = { email:u.email, nome: perfil.nome || u.email.split("@")[0], papel: master ? "Master" : "Acesso: " + (perfil.salas || []).map((id) => (roomById(id) || {}).nome || id).join(", "),
             salas: master ? TODAS_SALAS.slice() : (perfil.salas || []) };
  try { const v = await db.collection("visual").doc(u.uid).get(); if (v.exists && v.data().look) { const j = JSON.parse(v.data().look); LOOK = { theme:{ ...DEFAULT_THEME, ...(j.theme || {}) }, floors:{ ...DEFAULT_FLOORS, ...(j.floors || {}) }, agents:j.agents || {} }; } } catch (e) {}
  S.view = { mode:"home" }; S.zoom = null; S.selAgent = null; S.freeView = false; S.localFeed = [];
  $("#ctlEdit").setAttribute("aria-pressed", "false");
  $("#uname").textContent = S.user.nome; $("#urole").textContent = S.user.papel;
  $("#login").hidden = true; $("#app").hidden = false;
  $("#map").classList.remove("zoomed"); $("#mapBack").hidden = true; $("#mapHint").hidden = false;
  rebuild(); render(); setViewBox(fullBox());
  ["pde", "central"].filter(can).forEach((id) => {
    unsubs.push(db.collection("snapshots").doc(id).onSnapshot((doc) => {
      if (doc.exists) SNAP[id] = doc.data();
      rebuild(); render();
    }, (err) => toast(`Não foi possível ler a sala ${roomById(id).nome}: ${err.code}`)));
  });
});
setInterval(() => { if (S.user) kpis(); }, 60000);
</script>
